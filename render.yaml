services:
  - type: web
    name: plant-production-dashboard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: APP_USERNAME
        value: admin
      - key: APP_ADMIN_EMAIL
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: PLANT_TIMEZONE
        value: America/Chicago
      - key: DB_POOL_MAX
        value: "8"
      - key: MAX_REQUEST_THREADS
        value: "32"
      - key: DASHBOARD_CACHE_TTL
        value: "1.5"
      - key: EMAIL_ENABLED
        value: "false"
      - key: EMAIL_PROVIDER
        value: google_apps_script
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false
      - key: GOOGLE_APPS_SCRIPT_SECRET
        sync: false
