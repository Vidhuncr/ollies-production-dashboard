<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ollies Production Login</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at top,#1b6b5b,#0a2822 65%);font:15px Segoe UI,Arial,sans-serif;color:#17202a}.box{width:min(420px,92vw);background:#fff;border-radius:18px;padding:32px;box-shadow:0 25px 70px #0006}h1{font-size:26px;margin:0 0 5px;color:#154c41}p{margin:0 0 24px;color:#67736f}label{display:block;font-weight:600;margin:13px 0 6px}input,button{width:100%;padding:12px;border-radius:9px;font:inherit}input{border:1px solid #cbd6d2}button{border:0;background:#18785b;color:#fff;font-weight:700;margin-top:20px;cursor:pointer}#error{min-height:20px;color:#b83440;margin-top:12px}.tv{display:block;text-align:center;margin-top:14px;color:#18785b;text-decoration:none}
</style></head><body><form class="box" id="loginForm"><h1>Ollies Production</h1><p>Sign in to manage orders and production.</p><label>Email</label><input name="email" type="email" autocomplete="username" placeholder="name@company.com" required autofocus><label>Password</label><input name="password" type="password" autocomplete="current-password" required><button>Sign In</button><div id="error"></div><a class="tv" href="/tv">Open read-only TV dashboard</a></form><script>
loginForm.onsubmit=async e=>{e.preventDefault();error.textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))}),j=await r.json();if(!r.ok)throw Error(j.error||'Login failed');location.href=j.role==='team'?'/entry':'/'}catch(ex){error.textContent=ex.message}};
</script></body></html>
